[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "relayfence"
version = "0.3.0"
description = "A shared coordination ledger for coding agents across tools."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "RelayFence contributors" }]
keywords = ["mcp", "agents", "coordination", "sqlite", "concurrency"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Topic :: Software Development"]
dependencies = [
  "mcp>=2.3,<3",
  "httpx>=0.28,<1",
  "httpx2>=2.13,<3",
  "pydantic>=2.11,<3",
  "starlette>=0.48,<2",
  "uvicorn>=0.34,<1",
]

[project.urls]
Homepage = "https://github.com/shyangar/relayfence"
Issues = "https://github.com/shyangar/relayfence/issues"

[project.scripts]
relayfence = "relayfence.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "build>=1.2,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/relayfence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.coverage.run]
source = ["relayfence"]
branch = true
